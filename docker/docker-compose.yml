name: ebook-library-system

services:
  app:
    build:
      context: ..
      dockerfile: docker/php/Dockerfile
    container_name: ebook_app
    working_dir: /var/www/html
    volumes:
      - ..:/var/www/html
    environment:
      DB_CONNECTION: mysql
      DB_HOST: ${DB_HOST}
      DB_PORT: ${DB_PORT}
      DB_DATABASE: ${DB_DATABASE}
      DB_USERNAME: ${DB_USERNAME}
      DB_PASSWORD: ${DB_PASSWORD}
    networks:
      - backend

  nginx:
    image: nginx:stable-alpine
    container_name: ebook_nginx
    ports:
      - "${APP_PORT}:80"
    volumes:
      - ..:/var/www/html:ro
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    networks:
      - backend
    depends_on:
      - app

# Shared network that the host's existing MySQL container ("db") is on.
networks:
  backend:
    external: true
