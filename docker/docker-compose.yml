name: ebook-library-system

services:
  app:
    build:
      context: ..
      dockerfile: docker/php/Dockerfile
    container_name: ebook_app
    working_dir: /var/www/html
    volumes:
      - ..:/var/www/html
    environment:
      DB_CONNECTION: mysql
      DB_HOST: db
      DB_PORT: ${DB_PORT}
      DB_DATABASE: ${DB_DATABASE}
      DB_USERNAME: ${DB_USERNAME}
      DB_PASSWORD: ${DB_PASSWORD}
    networks:
      - backend
    depends_on:
      db:
        condition: service_healthy

  nginx:
    image: nginx:stable-alpine
    container_name: ebook_nginx
    ports:
      - "${APP_PORT}:80"
    volumes:
      - ..:/var/www/html:ro
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    networks:
      - backend
    depends_on:
      - app

  db:
    image: mariadb:11
    container_name: ebook_db
    command: ["--port=${DB_PORT}"]
    environment:
      MARIADB_DATABASE: ${DB_DATABASE}
      MARIADB_USER: ${DB_USERNAME}
      MARIADB_PASSWORD: ${DB_PASSWORD}
      MARIADB_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
    volumes:
      - db_data:/var/lib/mysql
    networks:
      - backend
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 5s
      timeout: 5s
      retries: 10
    # No "ports:" — MariaDB is reachable only from other containers on the
    # "backend" network (app, pma), never from the host.

  pma:
    image: phpmyadmin:latest
    container_name: ebook_pma
    environment:
      PMA_HOST: db
      PMA_PORT: ${DB_PORT}
      UPLOAD_LIMIT: 120M
    ports:
      - "${PMA_PORT}:80"
    networks:
      - backend
    depends_on:
      db:
        condition: service_healthy

networks:
  backend:
    driver: bridge

volumes:
  db_data:
